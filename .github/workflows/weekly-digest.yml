# Runs the automatable part of the weekly cycle and leaves the digest ready
# for a person to finish and send.
#
# It cannot collect Glassdoor, AmbitionBox or LinkedIn: those block automated
# access and offer no public API, and the brief commits to staying inside their
# terms. Feeds only - Reddit, news alerts, and X where a token is configured.
name: Weekly HR Intelligence digest

on:
  schedule:
    # Friday 09:00 IST = 03:30 UTC. Matches the sweep window in
    # config/settings.yaml, so the collected rows are waiting when the
    # sweeper sits down.
    - cron: "30 3 * * 5"
  workflow_dispatch:
    inputs:
      week:
        description: "week_of start day (YYYY-MM-DD); blank = the reporting week"
        required: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Run the weekly cycle
        run: |
          python scripts/weekly_run.py ${{ inputs.week && format('--week {0}', inputs.week) || '' }} \
            | tee weekly-run.log
        continue-on-error: true

      - name: Commit anything the collector found
        run: |
          git config user.name  "hr-intel-bot"
          git config user.email "hr-intel-bot@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No new rows collected - nothing to commit."
          else
            git add data/
            git commit -m "Weekly collection: new mentions from feeds"
            git push
          fi

      - name: Upload the digest and the run log
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest
          path: |
            out/digest-*.html
            out/digest-*.txt
            weekly-run.log
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "## Weekly HR Intelligence run"
            echo ""
            echo "The feed collection, validation and digest build have run."
            echo "**A person still has to finish it** - see 'STILL NEEDS A PERSON' in the log."
            echo ""
            echo '```'
            tail -n 25 weekly-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
