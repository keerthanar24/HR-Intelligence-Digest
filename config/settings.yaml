# Programme settings used by the scripts.

programme:
  name: HR Intelligence Digest
  trial_start: "2026-09-18"   # week 1 start (Friday); drives the Phase 3 review date
  owner: "TODO: name of the desk owner"
  reply_to: "TODO: hr-intel@example.com"

digest:
  # The reporting week runs Friday 00:00 to Thursday 23:59, and the digest is
  # sent on Friday covering the week that closed the night before. week_of is
  # the Friday that starts the week.
  #
  # The team's working days are Sunday to Thursday, which sit entirely inside
  # this window. The window is the full seven days on purpose: a five-day
  # window would leave Friday and Saturday outside every week, and anything
  # posted then would never reach a digest.
  week_start: friday
  send_day: friday
  send_time: "10:00"
  subject_template: "HR Intelligence Digest — week of {week_of} ({mention_count} mentions)"
  # The shared spreadsheet the digest links to in section 6.
  data_link: "https://docs.google.com/spreadsheets/d/155xO1Ui6aIL7KLh9qMEhbxAtnTe6b6eAnl3kO36pRGg/edit"
  # Show at most this many themes in section 4.
  max_themes: 4
  # Truncate one-line summaries in the What's New table to this many characters.
  summary_max_chars: 160

red_flags:
  # Same-day escalation. See docs/04-red-flag-protocol.md.
  sla_hours: 8
  # A mention with engagement at or above this is treated as public-escalation risk.
  virality_engagement_threshold: 100

collector:
  user_agent: "HR-Intelligence-Digest/1.0 (internal awareness monitoring; contact: TODO)"
  timeout_seconds: 20
  # Politeness gap between feed fetches.
  delay_seconds: 2
  # Posts to request per X search call (10-100). Recent search covers 7 days.
  x_max_results: 100
  # The X bearer token is read from the X_BEARER_TOKEN environment variable and
  # must never be written here - this file is committed.
  #
  # Require an employment-context term as well as an entity alias for these
  # platforms. Review sites are exempt: every review is employment-related.
  context_required_for: [news, reddit, x, quora, youtube, google_reviews]
