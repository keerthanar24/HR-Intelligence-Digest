# Programme settings used by the scripts.

programme:
  name: HR Intelligence Digest
  trial_start: "2026-09-19"   # week 1 start (Saturday); drives the Phase 3 review date
  owner: "TODO: name of the desk owner"
  reply_to: "TODO: hr-intel@example.com"

digest:
  # The reporting week runs Saturday 00:00 to Friday, and the digest is sent
  # that Friday afternoon - so the week ends on the day it is reported, and
  # leadership gets the summary before the workweek closes. week_of is the
  # Saturday that starts the week.
  #
  #   Sweep window  Friday 09:00-11:00  (sweep, update the sheet, draft)
  #   Send window   Friday 15:00-17:00
  #
  # Seven full days, so no date falls outside a reporting week.
  week_start: saturday
  send_day: friday
  send_time: "15:00"
  sweep_window: "09:00-11:00"
  send_window: "15:00-17:00"
  subject_template: "HR Intelligence Digest — week of {week_of} ({mention_count} mentions)"
  # The shared spreadsheet the digest links to in section 6.
  # Replaced 2026-09-22. The original sheet was never populated; this one was
  # created by uploading the generated workbook to Drive. The gid and fragment
  # from the address bar are dropped so the link opens on the first tab rather
  # than wherever the person who copied it happened to be looking.
  data_link: "https://docs.google.com/spreadsheets/d/1qjXDaHco0C64WydD2j_CfRshGGdAEVQ_/edit"
  # Show at most this many themes in section 4.
  max_themes: 4
  # Section 4 also reports themes recurring across this many weeks. A complaint
  # appearing once a week for a month is a pattern a seven-day window cannot
  # see - each week alone would call it a single mention.
  rolling_theme_weeks: 4
  # Truncate one-line summaries in the What's New table to this many characters.
  summary_max_chars: 160

red_flags:
  # Same-day escalation. See docs/04-red-flag-protocol.md.
  sla_hours: 8
  # A mention with engagement at or above this is treated as public-escalation risk.
  virality_engagement_threshold: 100

collector:
  user_agent: "HR-Intelligence-Digest/1.0 (internal awareness monitoring; contact: TODO)"
  timeout_seconds: 20
  # Politeness gap between feed fetches.
  delay_seconds: 2
  context_required_for: [news, reddit, x, quora, youtube, google_reviews]
