# Entity and keyword register for the HR Intelligence Digest.
#
# Every search, alert and automated feed filter is driven from this file.
# Edit here, not in the scripts.
#
# aliases        : spellings people actually use (including misspellings and
#                  previous names). Matching is case-insensitive and ignores
#                  punctuation, so "R.K. Group" matches "rk group".
# exclude_terms  : if one of these appears near the match, the hit is most
#                  likely a different company or a customer/product topic.
# needs_confirmation: previous/registered names that HR must confirm before we
#                  rely on them. Left in the list but flagged.

# Group structure, confirmed by the programme owner 2026-09-21:
#
#   RK Group (parent)
#    |- RK World Infocom Pvt Ltd
#    |- Robust Kommerce
#    \- Westbury Kommerce
#
# ValueCart is a separate company under the same parent, and is deliberately
# OUT OF SCOPE for this trial (programme owner, 2026-09-21). Its names are not
# in the register, so its chatter matches nothing and is neither tracked nor
# misfiled against RK World Infocom. Do not add them back without asking: it
# was briefly in scope and its Glassdoor baseline was 4.70 on 14 reviews, so
# adding it later changes the group total and the headline range.

entities:
  - id: rk_group
    name: RK Group
    role: Parent / corporate brand
    parent: null
    aliases:
      - RK Group
      - R K Group
      - R.K. Group
      - RKGroup
      - RK Grp
      - RK group of companies
      - RK Groups
    # Confirmed 2026-09-21: there is no "RK Enterprises". It was a placeholder
    # invented at setup and is removed rather than carried as a maybe.
    needs_confirmation: []
    exclude_terms:
      - RK Group of Hotels
      - RK Group Dubai

  - id: rk_world
    name: RK World Infocom
    legal_name: RK World Infocom Pvt Ltd
    role: Operating entity (subsidiary of RK Group)
    parent: rk_group
    aliases:
      - RK World
      - R K World
      - R.K. World
      - RKWorld
      - RK Worlds
      - RK World Pvt
      - RK World Private Limited
      # Confirmed 2026-09-21: AmbitionBox lists it as R K World Infocom and
      # Glassdoor as Rk Worldinfocom. This is the name on the offer letter,
      # and the one reviewers copy.
      - RK World Infocom
      - R K World Infocom
      - RK Worldinfocom
      - Worldinfocom
    needs_confirmation: []
    exclude_terms:
      - RK World Tours

  - id: robust_kommerce
    name: Robust Kommerce
    role: Operating entity (subsidiary of RK Group)
    parent: rk_group
    aliases:
      - Robust Kommerce
      - Robust Commerce
      - Robust Komerce
      - Robust Kommers
      - RobustKommerce
      - Robust E-Commerce
      - Robust Ecommerce
    needs_confirmation:
      # Promoted when the AmbitionBox page .../robust-results-overview was
      # given as this entity's, then demoted on 2026-09-21 when no Robust
      # Kommerce page could be found on AmbitionBox at all. The alias rests
      # entirely on that page, so if the page is a different company this name
      # is not ours. Still searched, but flagged until someone confirms.
      - Robust Results
    # Glassdoor lists this company as plain "Robust" (employer id 1882698).
    # Deliberately NOT added as an alias: on its own the word matches "robust
    # growth", "robust system" and so on, and would bury the sheet in noise.
    # The Glassdoor page is swept directly by URL, so nothing is lost.
    exclude_terms: []

  - id: westbury_kommerce
    name: Westbury Kommerce
    role: Operating entity (subsidiary of RK Group)
    parent: rk_group
    aliases:
      - Westbury Kommerce
      - Westbury Commerce
      - Westbury Komerce
      - Westburry Kommerce
      - Westbery Kommerce
      - West Bury Kommerce
      - WestburyKommerce
    needs_confirmation: []
    exclude_terms:
      - Westbury New York
      - Westbury Hotel

# Employment-context terms. A raw entity match plus one of these is what makes a
# hit relevant. Used to filter noisy feeds (news, X, Reddit) — not applied to
# review sites, where every review is employment-related by definition.
context_terms:
  - salary
  - salaries
  - ctc
  - appraisal
  - increment
  - hike
  - bonus
  - incentive
  - manager
  - management
  - hr
  - human resources
  - interview
  - interviewed
  - hiring
  - recruiter
  - offer letter
  - joining
  - onboarding
  - notice period
  - resign
  - resigned
  - resignation
  - quit
  - exit
  - relieving letter
  - experience letter
  - full and final
  - fnf
  - f&f
  - settlement
  - pf
  - provident fund
  - esic
  - gratuity
  - layoff
  - laid off
  - fired
  - terminated
  - work culture
  - toxic
  - work life balance
  - working hours
  - overtime
  - night shift
  - harassment
  - bullying
  - abusive
  - unsafe
  - employee
  - employees
  - ex-employee
  - working at
  - work at
  - job
  - intern
  - internship
  - probation
  - appraisal cycle
  - unpaid

# Terms that mark a hit as almost certainly out of scope (customer/product side).
# Used as a demotion signal, not an automatic delete — a human confirms.
out_of_scope_terms:
  - refund
  - delivery
  - order id
  - courier
  - defective
  - warranty
  - return policy
  - seller account
  - product quality
  - customer care
  - shipment
