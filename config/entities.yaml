# Entity and keyword register for the HR Intelligence Digest.
#
# Every search, alert and automated feed filter is driven from this file.
# Edit here, not in the scripts.
#
# aliases        : spellings people actually use (including misspellings and
#                  previous names). Matching is case-insensitive and ignores
#                  punctuation, so "R.K. Group" matches "rk group".
# exclude_terms  : if one of these appears near the match, the hit is most
#                  likely a different company or a customer/product topic.
# needs_confirmation: previous/registered names that HR must confirm before we
#                  rely on them. Left in the list but flagged.

# Group structure, confirmed by the programme owner 2026-09-21:
#
#   RK Group (parent)
#    |- RK World Infocom Pvt Ltd   -- customer-facing brand: ValueCart
#    |- Robust Kommerce            -- listed on AmbitionBox as Robust Results
#    \- Westbury Kommerce
#
# ValueCart is a BRAND of RK World Infocom, not a separate company, so its
# mentions roll up to that entity rather than getting a row of their own.

entities:
  - id: rk_group
    name: RK Group
    role: Parent / corporate brand
    parent: null
    aliases:
      - RK Group
      - R K Group
      - R.K. Group
      - RKGroup
      - RK Grp
      - RK group of companies
      - RK Groups
    needs_confirmation:
      # Placeholder invented during setup, with no evidence behind it. No
      # platform listing has corroborated it. Confirm with HR or delete it -
      # do not treat it as a known former name.
      - RK Enterprises
    exclude_terms:
      - RK Group of Hotels
      - RK Group Dubai

  - id: rk_world
    name: RK World Infocom
    legal_name: RK World Infocom Pvt Ltd
    role: Operating entity (subsidiary of RK Group)
    parent: rk_group
    # Customer-facing brand. Employees and candidates write this far more often
    # than the registered name, so it carries most of the signal.
    brands: [ValueCart]
    aliases:
      - RK World
      - R K World
      - R.K. World
      - RKWorld
      - RK Worlds
      - RK World Pvt
      - RK World Private Limited
      # Confirmed 2026-09-21: the LinkedIn page for this entity is branded
      # ValueCart, so this is the customer-facing name and very likely what
      # employees write.
      - ValueCart
      - Value Cart
      # Confirmed 2026-09-21: AmbitionBox lists it as R K World Infocom and
      # Glassdoor as Rk Worldinfocom. This is the name on the offer letter,
      # and the one reviewers copy.
      - RK World Infocom
      - R K World Infocom
      - RK Worldinfocom
      - Worldinfocom
    needs_confirmation: []
    exclude_terms:
      - RK World Tours

  - id: robust_kommerce
    name: Robust Kommerce
    role: Operating entity (subsidiary of RK Group)
    parent: rk_group
    aliases:
      - Robust Kommerce
      - Robust Commerce
      - Robust Komerce
      - Robust Kommers
      - RobustKommerce
      - Robust E-Commerce
      - Robust Ecommerce
    needs_confirmation:
      # Promoted when the AmbitionBox page .../robust-results-overview was
      # given as this entity's, then demoted on 2026-09-21 when no Robust
      # Kommerce page could be found on AmbitionBox at all. The alias rests
      # entirely on that page, so if the page is a different company this name
      # is not ours. Still searched, but flagged until someone confirms.
      - Robust Results
    # Glassdoor lists this company as plain "Robust" (employer id 1882698).
    # Deliberately NOT added as an alias: on its own the word matches "robust
    # growth", "robust system" and so on, and would bury the sheet in noise.
    # The Glassdoor page is swept directly by URL, so nothing is lost.
    exclude_terms: []

  - id: westbury_kommerce
    name: Westbury Kommerce
    role: Operating entity (subsidiary of RK Group)
    parent: rk_group
    aliases:
      - Westbury Kommerce
      - Westbury Commerce
      - Westbury Komerce
      - Westburry Kommerce
      - Westbery Kommerce
      - West Bury Kommerce
      - WestburyKommerce
    needs_confirmation: []
    exclude_terms:
      - Westbury New York
      - Westbury Hotel

# Employment-context terms. A raw entity match plus one of these is what makes a
# hit relevant. Used to filter noisy feeds (news, X, Reddit) — not applied to
# review sites, where every review is employment-related by definition.
context_terms:
  - salary
  - salaries
  - ctc
  - appraisal
  - increment
  - hike
  - bonus
  - incentive
  - manager
  - management
  - hr
  - human resources
  - interview
  - interviewed
  - hiring
  - recruiter
  - offer letter
  - joining
  - onboarding
  - notice period
  - resign
  - resigned
  - resignation
  - quit
  - exit
  - relieving letter
  - experience letter
  - full and final
  - fnf
  - f&f
  - settlement
  - pf
  - provident fund
  - esic
  - gratuity
  - layoff
  - laid off
  - fired
  - terminated
  - work culture
  - toxic
  - work life balance
  - working hours
  - overtime
  - night shift
  - harassment
  - bullying
  - abusive
  - unsafe
  - employee
  - employees
  - ex-employee
  - working at
  - work at
  - job
  - intern
  - internship
  - probation
  - appraisal cycle
  - unpaid

# Terms that mark a hit as almost certainly out of scope (customer/product side).
# Used as a demotion signal, not an automatic delete — a human confirms.
out_of_scope_terms:
  - refund
  - delivery
  - order id
  - courier
  - defective
  - warranty
  - return policy
  - seller account
  - product quality
  - customer care
  - shipment
