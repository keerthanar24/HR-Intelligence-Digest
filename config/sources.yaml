# Platform source map — machine-readable half.
# Narrative, search strings and compliance notes: docs/02-source-map.md
#
# collection:
#   manual     - a person opens the page on the sweep schedule and records what is new
#   feed       - a publisher-provided RSS/Atom feed the collector may fetch
#   alert      - a standing Google Alert / platform alert that emails or feeds into us
#
# Nothing in this file may point a script at a page the platform's terms reserve for
# human browsing. Glassdoor, AmbitionBox and LinkedIn are manual for that reason.

platforms:
  - id: ambitionbox
    name: AmbitionBox
    collection: manual
    cadence: weekly
    priority: 1
    captures: [reviews, ratings, interviews, salaries]
    notes: >-
      Highest expected volume for India. Record the overall rating and review count
      into data/ratings.csv on every sweep, even when no new review appeared.
    urls:
      # Company identities confirmed by the programme owner, 2026-09-21.
      # URLs are held in the canonical all-locations REVIEWS form: a location-
      # or overview-scoped link hides reviews from other offices and nothing
      # downstream reveals the gap. The supplied link is kept beside each one.
      #
      # supplied: .../reviews/r-dot-k-dot-group-reviews/bengaluru-location
      rk_group: "https://www.ambitionbox.com/reviews/r-dot-k-dot-group-reviews"   # Bengaluru filter dropped
      # supplied: .../overview/r-k-world-infocom-overview/locations/bengaluru-offices
      rk_world: "https://www.ambitionbox.com/reviews/r-k-world-infocom-reviews"   # reviews page, all locations
      # supplied: .../overview/robust-results-overview  -- listed as "Robust Results"
      robust_kommerce: "https://www.ambitionbox.com/reviews/robust-results-reviews"   # reviews page
      westbury_kommerce: "https://www.ambitionbox.com/reviews/westbury-kommerce-reviews"

  - id: glassdoor
    name: Glassdoor
    collection: manual
    cadence: weekly
    priority: 1
    captures: [reviews, ratings, interviews, salaries]
    notes: Record rating + review count weekly into data/ratings.csv.
    urls:
      # Company identities confirmed by the programme owner, 2026-09-21.
      # Canonical all-locations form is /Reviews/<Name>-Reviews-E<id>.htm. The
      # employer id is what resolves the company; the name slug is cosmetic, so
      # the id is always kept. The supplied link is noted beside each one.
      #
      # supplied: /Reviews/RK-Group-Bangalore-Reviews-EI_IE653077.0,8_IL.9,18_IM1091.htm
      rk_group: "https://www.glassdoor.co.in/Reviews/RK-Group-Reviews-E653077.htm"   # Bangalore filter dropped
      # supplied: /Overview/Working-at-Rk-Worldinfocom-EI_IE8268877.11,26.htm
      rk_world: "https://www.glassdoor.co.in/Reviews/Rk-Worldinfocom-Reviews-E8268877.htm"   # reviews, not overview
      # supplied: /Overview/Working-at-Robust-EI_IE1882698.11,17.htm
      # Listed on Glassdoor as plain "Robust"; confirmed as Robust Kommerce by
      # the programme owner on 2026-09-21.
      robust_kommerce: "https://www.glassdoor.co.in/Reviews/Robust-Reviews-E1882698.htm"
      westbury_kommerce: "https://www.glassdoor.co.in/Reviews/Westbury-Kommerce-Reviews-E6166527.htm"

  - id: linkedin
    name: LinkedIn
    collection: manual
    cadence: weekly
    priority: 1
    captures: [company_page_activity, employee_posts, comments, exit_updates]
    notes: >-
      Company page activity and public post search only. Do not browse or compile
      individual personal profiles — see the boundary in docs/00-brief.md section 4.
    urls:
      rk_group: "https://www.linkedin.com/company/rk-groupp/"
      # NOTE: RK World's page is branded ValueCart. If ValueCart is the
      # customer-facing name, employees will write that, not "RK World" —
      # see the needs_confirmation entry in config/entities.yaml.
      rk_world: "https://www.linkedin.com/company/valuecart/"
      robust_kommerce: "https://www.linkedin.com/company/robust-kommerce-india/"
      westbury_kommerce: "https://www.linkedin.com/company/westbury-kommerce/"

  - id: indeed
    name: Indeed
    collection: manual
    cadence: fortnightly
    priority: 2
    captures: [reviews, interviews]
    urls: {}

  - id: x
    name: X
    collection: api
    cadence: weekly
    priority: 2
    captures: [mentions, complaints, threads]
    notes: >-
      Collected through X's official recent-search API when $X_BEARER_TOKEN is
      set in the environment (never in this repo). The API also returns like,
      repost, reply and quote counts, which is what makes the
      public_escalation_risk red-flag threshold measurable rather than a guess.
      Without a token the collector says so and X falls back to the logged-out
      manual search in docs/02-source-map.md.
    urls: {}

  - id: quora
    name: Quora
    collection: alert
    cadence: weekly
    priority: 3
    captures: [answers]
    urls: {}

  - id: reddit
    name: Reddit
    collection: feed
    cadence: weekly
    priority: 2
    captures: [threads, comments]
    urls: {}

  - id: youtube
    name: YouTube
    collection: manual
    cadence: fortnightly
    priority: 3
    captures: [comments]
    notes: Comments on videos about the group. Employment-related comments only.
    urls: {}

  - id: google_reviews
    name: Google Reviews
    collection: manual
    cadence: fortnightly
    priority: 3
    captures: [reviews]
    notes: Employment-related reviews only — skip customer and product reviews.
    urls: {}

  - id: news
    name: News / web
    collection: feed
    cadence: weekly
    priority: 3
    captures: [articles]
    urls: {}

# Feeds the collector may fetch (scripts/collect_feeds.py).
# Each one is a feed the publisher offers openly for machine reading.
#
# Google Alerts: create the alert at https://www.google.com/alerts, set
# "Deliver to: RSS feed", then paste the feed URL here.
feeds:
  - id: google_alerts_rk_group
    platform: news
    entity: rk_group
    enabled: false
    url: "TODO: paste Google Alerts RSS URL for RK Group"

  - id: google_alerts_rk_world
    platform: news
    entity: rk_world
    enabled: false
    url: "TODO: paste Google Alerts RSS URL for RK World"

  - id: google_alerts_robust_kommerce
    platform: news
    entity: robust_kommerce
    enabled: false
    url: "TODO: paste Google Alerts RSS URL for Robust Kommerce"

  - id: google_alerts_westbury_kommerce
    platform: news
    entity: westbury_kommerce
    enabled: false
    url: "TODO: paste Google Alerts RSS URL for Westbury Kommerce"

  - id: reddit_search_rk_world
    platform: reddit
    entity: rk_world
    enabled: true
    # Search built from the entity aliases at run time, so a new
    # trading name is picked up without editing this file.
    auto_query: reddit

  - id: reddit_search_robust_kommerce
    platform: reddit
    entity: robust_kommerce
    enabled: true
    # Search built from the entity aliases at run time, so a new
    # trading name is picked up without editing this file.
    auto_query: reddit

  - id: reddit_search_westbury_kommerce
    platform: reddit
    entity: westbury_kommerce
    enabled: true
    # Search built from the entity aliases at run time, so a new
    # trading name is picked up without editing this file.
    auto_query: reddit

  # X recent search. Needs a paid X API plan; set X_BEARER_TOKEN in the
  # environment and flip enabled to true. Queries are built from the alias
  # register at run time, like the Reddit ones.
  - id: x_search_rk_group
    platform: x
    entity: rk_group
    source: x_api
    enabled: false

  - id: x_search_rk_world
    platform: x
    entity: rk_world
    source: x_api
    enabled: false

  - id: x_search_robust_kommerce
    platform: x
    entity: robust_kommerce
    source: x_api
    enabled: false

  - id: x_search_westbury_kommerce
    platform: x
    entity: westbury_kommerce
    source: x_api
    enabled: false

  - id: reddit_search_rk_group
    platform: reddit
    entity: rk_group
    enabled: true
    # Search built from the entity aliases at run time, so a new
    # trading name is picked up without editing this file.
    auto_query: reddit
