# Platform source map — machine-readable half.
# Narrative, search strings and compliance notes: docs/02-source-map.md
#
# collection:
#   manual     - a person opens the page on the sweep schedule and records what is new
#   feed       - a publisher-provided RSS/Atom feed the collector may fetch
#   alert      - a standing Google Alert / platform alert that emails or feeds into us
#
# Nothing in this file may point a script at a page the platform's terms reserve for
# human browsing. Glassdoor, AmbitionBox and LinkedIn are manual for that reason.

platforms:
  - id: ambitionbox
    name: AmbitionBox
    collection: manual
    cadence: weekly
    priority: 1
    captures: [reviews, ratings, interviews, salaries]
    # Headline figures this platform actually prints. A field the platform
    # never publishes is recorded as 'n/a', so it cannot be mistaken for a
    # number the sweep failed to pick up. AmbitionBox shows neither a
    # would-recommend percentage nor CEO approval.
    publishes: [overall_rating, review_count, sub_scores]
    # Tabs on the same page the sweep already has open. Interview experiences
    # are named in the project scope and were never swept once: the SOP said
    # "new reviews, interviews, salaries" and the generated worksheet gave only
    # the Reviews URL, so the tab was in the prose and absent from the tool.
    # Tabs rather than derived URLs - a guessed slug that 404s is worse than an
    # instruction to click what is already on screen.
    also_check:
      - "Interviews tab - log as a mention, theme 'interview', author 'candidate'"
      - "Salaries tab - read for context only; there is no field for it yet"
    notes: >-
      Highest expected volume for India. Record the overall rating and review count
      into data/ratings.csv on every sweep, even when no new review appeared.
    urls:
      # Company identities confirmed by the programme owner, 2026-09-21.
      # URLs are held in the canonical all-locations REVIEWS form: a location-
      # or overview-scoped link hides reviews from other offices and nothing
      # downstream reveals the gap. The supplied link is kept beside each one.
      #
      # supplied: .../reviews/r-dot-k-dot-group-reviews/bengaluru-location
      rk_group: "https://www.ambitionbox.com/reviews/r-dot-k-dot-group-reviews"   # Bengaluru filter dropped
      # supplied: .../overview/r-k-world-infocom-overview/locations/bengaluru-offices
      rk_world: "https://www.ambitionbox.com/reviews/r-k-world-infocom-reviews"   # reviews page, all locations
      # none = confirmed absent, as opposed to not yet filled in. The programme
      # owner could not find any Robust Kommerce page on AmbitionBox
      # (2026-09-21). An earlier link, .../overview/robust-results-overview,
      # was supplied for this entity; if that page is not Robust Kommerce then
      # "Robust Results" is not one of its names either - see entities.yaml.
      robust_kommerce: "none"
      westbury_kommerce: "https://www.ambitionbox.com/reviews/westbury-kommerce-reviews"

  - id: glassdoor
    name: Glassdoor
    collection: manual
    cadence: weekly
    priority: 1
    captures: [reviews, ratings, interviews, salaries]
    # Glassdoor prints CEO approval only once a profile carries enough
    # ratings; none of the four do today, so it records as 'not shown'
    # rather than blank.
    publishes: [overall_rating, review_count, sub_scores, recommend_pct, ceo_approval_pct]
    also_check:
      - "Interviews tab - log as a mention, theme 'interview', author 'candidate'"
      - "Salaries tab - read for context only; there is no field for it yet"
    notes: Record rating + review count weekly into data/ratings.csv.
    urls:
      # Company identities confirmed by the programme owner, 2026-09-21.
      # Canonical all-locations form is /Reviews/<Name>-Reviews-E<id>.htm. The
      # employer id is what resolves the company; the name slug is cosmetic, so
      # the id is always kept. The supplied link is noted beside each one.
      #
      # supplied: /Reviews/RK-Group-Bangalore-Reviews-EI_IE653077.0,8_IL.9,18_IM1091.htm
      rk_group: "https://www.glassdoor.co.in/Reviews/RK-Group-Reviews-E653077.htm"   # Bangalore filter dropped
      # supplied: /Overview/Working-at-Rk-Worldinfocom-EI_IE8268877.11,26.htm
      rk_world: "https://www.glassdoor.co.in/Reviews/Rk-Worldinfocom-Reviews-E8268877.htm"   # reviews, not overview
      # Glassdoor employer 1882698, listed as plain "Robust". The programme owner
      # first said this was not Robust Kommerce, then on 2026-09-21 supplied
      # /Overview/Working-at-Robust-EI_IE1882698.11,17.htm as the company's own
      # Glassdoor page - the same employer id. Taken as confirmed on the second,
      # specific statement. Stored in the canonical reviews form; the Overview
      # page carries no review list.
      robust_kommerce: "https://www.glassdoor.co.in/Reviews/Robust-Reviews-E1882698.htm"
      westbury_kommerce: "https://www.glassdoor.co.in/Reviews/Westbury-Kommerce-Reviews-E6166527.htm"

  - id: linkedin
    name: LinkedIn
    collection: manual
    cadence: weekly
    priority: 1
    captures: [company_page_activity, employee_posts, comments, exit_updates]
    # The company pages below cover two of those four. Employee posts and
    # ex-employee updates are written by individuals and do not appear on the
    # company page at all, so without a content search they had no entry point
    # and were in the source map in name only. This searches POSTS for the
    # company name, which is public commentary about an employer - not the
    # same thing as opening someone's profile, which stays out of scope.
    # datePosted=past-week matches the Saturday-Friday reporting week closely
    # enough, and is what stops the sweep re-reading the same posts every week:
    # without it LinkedIn sorts by relevance, and relevance does not change.
    # Needs a logged-in session - LinkedIn content search is not public, so
    # this can never be automated and always needs a person.
    search_url: "https://www.linkedin.com/search/results/content/?keywords={query}&datePosted=%22past-week%22&sortBy=%22date_posted%22"
    notes: >-
      Company page activity and public post search only. Do not browse or compile
      individual personal profiles — see the boundary in docs/00-brief.md section 4.
    urls:
      rk_group: "https://www.linkedin.com/company/rk-groupp/"
      # linkedin.com/company/valuecart belongs to ValueCart, which is out of
      # scope, so it is not listed here.
      rk_world: "https://www.linkedin.com/company/rk-world-infocom-private-limited/"
      robust_kommerce: "https://www.linkedin.com/company/robust-kommerce-india/"
      westbury_kommerce: "https://www.linkedin.com/company/westbury-kommerce/"

  - id: indeed
    name: Indeed
    collection: manual
    cadence: fortnightly
    priority: 2
    captures: [reviews, interviews]
    # Swept 2026-09-22 (trial week 1): NO Indeed employer page exists for any
    # of the four entities. Not "a page with no reviews" - no profile at all,
    # so there is nothing to sort by newest and nothing to return every
    # fortnight. Recorded in data/sweeps.csv rather than left as folklore.
    #
    # Kept in the source map, not deleted: a profile can be created at any
    # time, usually by a candidate or by Indeed itself once a job is posted,
    # and google_alerts_indeed is the standing cover for exactly that. Confirm
    # once more in week 3; if it is still absent, the fortnightly manual look
    # has nothing to look at and the alert should carry the channel alone.
    urls: {}

  - id: x
    name: X
    collection: api
    cadence: weekly
    priority: 2
    captures: [mentions, complaints, threads]
    notes: >-
      Collected through X's official recent-search API when $X_BEARER_TOKEN is
      set in the environment (never in this repo). The API also returns like,
      repost, reply and quote counts, which is what makes the
      public_escalation_risk red-flag threshold measurable rather than a guess.
      Without a token the collector says so and X falls back to the logged-out
      manual search in docs/02-source-map.md.
    urls: {}

  - id: quora
    name: Quora
    collection: alert
    cadence: weekly
    priority: 3
    captures: [answers]
    urls: {}

  - id: reddit
    name: Reddit
    collection: feed
    cadence: weekly
    priority: 2
    captures: [threads, comments]
    urls: {}

  - id: youtube
    name: YouTube
    collection: manual
    cadence: fortnightly
    priority: 3
    captures: [comments]
    notes: Comments on videos about the group. Employment-related comments only.
    urls: {}

  - id: google_reviews
    name: Google Reviews
    collection: manual
    cadence: fortnightly
    priority: 3
    captures: [reviews]
    notes: Employment-related reviews only — skip customer and product reviews.
    urls: {}

  - id: news
    name: News / web
    collection: feed
    cadence: weekly
    priority: 3
    captures: [articles]
    urls: {}

# Feeds the collector may fetch (scripts/collect_feeds.py).
# Each one is a feed the publisher offers openly for machine reading.
#
# Google Alerts: create the alert at https://www.google.com/alerts, set
# "Deliver to: RSS feed", then paste the feed URL here.
feeds:
  - id: google_alerts_rk_group
    platform: news
    entity: rk_group
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/6114674906063014284"

  - id: google_alerts_rk_world
    platform: news
    entity: rk_world
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/6741995754671900552"

  - id: google_alerts_robust_kommerce
    platform: news
    entity: robust_kommerce
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/629722955404059143"

  - id: google_alerts_westbury_kommerce
    platform: news
    entity: westbury_kommerce
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/1095068575065823383"

  # The cross-entity red-flag alert. Deliberately has NO 'entity' key: it
  # covers all four, so the collector assigns each item to whichever entity
  # the text actually matches rather than to a fixed one. Worth checking
  # daily - it is the closest thing to same-day cover between sweeps for
  # anything that reaches the open web.
  - id: google_alerts_red_flags
    platform: news
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/6741995754671899454"

  # Site-restricted alert covering all four entities on one platform, rather
  # than one alert per entity: Quora volume for a group this size does not
  # justify four, and a single feed is one thing to keep working. It catches
  # what Google NEWLY indexes, so it is standing cover from here on - the back
  # catalogue still needs the one manual look.
  # Second URL. The first, .../6189939704157504110, returned HTTP 400 - the
  # feed id had no alert behind it, so that alert was never actually saved.
  # Supplied again on 2026-09-23 as .../9279805802777017235, a different id,
  # so this one exists. Not yet fetched from anywhere: verify with
  # `make checkfeeds` before trusting it, because a feed that 400s leaves its
  # channel swept by nobody - log_sweep skips a channel it believes is fed,
  # and the collector records nothing when the fetch fails.
  - id: google_alerts_quora
    platform: quora
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/9279805802777017235"

  # Indeed has no API and blocks automated collection, so this alert is the
  # only automation available for it. It stays on the MANUAL rotation as well:
  # Indeed's company pages are indexed but individual reviews often are not,
  # and an alert only fires on what Google newly indexes. Partial cover, not
  # cover - which is why sources.yaml still calls Indeed collection: manual.
  - id: google_alerts_indeed
    platform: indeed
    enabled: true
    url: "https://www.google.com/alerts/feeds/06869919047613217312/7799003522757902966"

  # ONE search for the whole group, not one per entity. Reddit rate-limits
  # per IP and cumulatively: across three real runs the first request always
  # succeeded and later ones 429'd, a different pair failing each time, so two
  # entities went unsearched every run while the retries deepened the
  # throttling. Four requests become one.
  #
  # No 'entity' key, like the cross-entity red-flag alert: the collector
  # assigns each hit to whichever entity its text matches, so the per-entity
  # binding is not needed and nothing is lost.
  - id: reddit_search_group
    platform: reddit
    enabled: true
    auto_query: reddit_all

  # X recent search. Needs a paid X API plan; set X_BEARER_TOKEN in the
  # environment and flip enabled to true. Queries are built from the alias
  # register at run time, like the Reddit ones.
  - id: x_search_rk_group
    platform: x
    entity: rk_group
    source: x_api
    enabled: false

  - id: x_search_rk_world
    platform: x
    entity: rk_world
    source: x_api
    enabled: false

  - id: x_search_robust_kommerce
    platform: x
    entity: robust_kommerce
    source: x_api
    enabled: false

  - id: x_search_westbury_kommerce
    platform: x
    entity: westbury_kommerce
    source: x_api
    enabled: false

